[project]
name = "drama-web"
version = "0.0.1"
description = "Static Web workbench (served by drama-api)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_web"]

[tool.hatch.build.targets.wheel.force-include]
"src/drama_web/static" = "drama_web/static"

[project]
name = "drama-api"
version = "0.0.1"
description = "Orchestration API stubs + in-memory job queue"
requires-python = ">=3.11"
dependencies = ["drama-pipeline", "fastapi>=0.111", "uvicorn>=0.30"]

[tool.uv.sources]
drama-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_api"]

[project]
name = "drama-api"
version = "0.0.1"
description = "Orchestration API + Redis/RQ jobs with in-process fallback"
requires-python = ">=3.11"
dependencies = [
    "drama-pipeline",
    "drama-deslop",
    "drama-web",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5.0",
    "rq>=1.16",
]

[project.scripts]
drama-factory-worker = "drama_api.worker:main"

[tool.uv.sources]
drama-pipeline = { workspace = true }
drama-deslop = { workspace = true }
drama-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_api"]

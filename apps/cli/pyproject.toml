[project]
name = "drama-cli"
version = "0.0.1"
description = "CLI to run the mock pipeline end-to-end"
requires-python = ">=3.11"
dependencies = ["drama-pipeline", "drama-deslop"]

[project.scripts]
drama-factory = "drama_cli.main:main"

[tool.uv.sources]
drama-pipeline = { workspace = true }
drama-deslop = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_cli"]

[project]
name = "drama-llm"
version = "0.0.1"
description = "Shared OpenAI-compatible chat client for novel writing and LLM-as-judge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_llm"]

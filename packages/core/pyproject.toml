[project]
name = "drama-core"
version = "0.0.1"
description = "Core schemas and pipeline state machine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_core"]

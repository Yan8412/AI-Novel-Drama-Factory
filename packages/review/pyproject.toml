[project]
name = "drama-review"
version = "0.0.1"
description = "Shared review records, reviewer protocol and retry policy"
requires-python = ">=3.11"
dependencies = ["drama-core"]

[tool.uv.sources]
drama-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_review"]

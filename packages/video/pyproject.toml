[project]
name = "drama-video"
version = "0.0.1"
description = "Image-to-video engine adapters"
requires-python = ">=3.11"
dependencies = ["drama-core"]

[tool.uv.sources]
drama-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_video"]

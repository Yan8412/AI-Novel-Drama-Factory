[project]
name = "drama-deslop"
version = "0.0.1"
description = "Anti-AI-flavor scan, rewrite templates, and continuity locks"
requires-python = ">=3.11"
dependencies = ["drama-core"]

[tool.uv.sources]
drama-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_deslop"]

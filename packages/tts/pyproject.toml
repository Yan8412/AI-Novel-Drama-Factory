[project]
name = "drama-tts"
version = "0.0.1"
description = "Optional TTS + subtitle tracks from shot dialogue"
requires-python = ">=3.11"
dependencies = ["drama-core", "httpx>=0.27"]

[tool.uv.sources]
drama-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_tts"]

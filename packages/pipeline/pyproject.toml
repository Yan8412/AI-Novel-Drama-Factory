[project]
name = "drama-pipeline"
version = "0.0.1"
description = "Pipeline orchestrator wiring engines through the FSM"
requires-python = ">=3.11"
dependencies = ["drama-core", "drama-review", "drama-novel", "drama-storyboard", "drama-vision", "drama-video"]

[tool.uv.sources]
drama-core = { workspace = true }
drama-review = { workspace = true }
drama-novel = { workspace = true }
drama-storyboard = { workspace = true }
drama-vision = { workspace = true }
drama-video = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_pipeline"]

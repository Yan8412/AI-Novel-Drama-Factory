[project]
name = "drama-vision"
version = "0.0.1"
description = "Character 9-view / scene / prop / keyframe image engines"
requires-python = ">=3.11"
dependencies = ["drama-core", "drama-deslop", "httpx>=0.27"]

[tool.uv.sources]
drama-core = { workspace = true }
drama-deslop = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_vision"]

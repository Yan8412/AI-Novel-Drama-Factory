[project]
name = "ai-novel-drama-factory"
version = "0.0.1"
description = "AI Novel -> vertical (9:16) short-drama factory (uv workspace root)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "drama-core",
    "drama-review",
    "drama-novel",
    "drama-storyboard",
    "drama-vision",
    "drama-video",
    "drama-pipeline",
    "drama-api",
    "drama-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
drama-core = { workspace = true }
drama-review = { workspace = true }
drama-novel = { workspace = true }
drama-storyboard = { workspace = true }
drama-vision = { workspace = true }
drama-video = { workspace = true }
drama-pipeline = { workspace = true }
drama-api = { workspace = true }
drama-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["output", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "packages/review/src",
    "packages/novel/src",
    "packages/storyboard/src",
    "packages/vision/src",
    "packages/video/src",
    "packages/pipeline/src",
    "apps/api/src",
    "apps/cli/src",
]
files = ["packages/*/src", "apps/*/src", "packages/*/tests", "apps/*/tests", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "--import-mode=importlib -q"
